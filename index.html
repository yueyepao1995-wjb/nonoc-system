<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">见</div><b>见微 · 经营</b><small>看见客户需求，把握服务时机<br>非 OC 客户智能工作台</small></div><nav class="nav" id="sideNav"></nav><div class="sidebottom"><div>● 本机虚构数据演示</div><div>不连接银行或外部 AI 服务</div><div id="saveStatus">正在检测保存能力…</div></div></aside><div class="main"><header class="topbar"><h1>见微 / 非 OC 客户经营工作台</h1><div class="topright"><span><span class="dot"></span> 虚构演示</span><span id="dateTop"></span><button class="btn tiny line" data-page="settings">备份</button></div></header><div id="appContent"></div></div></div><nav class="mobileNav" id="mobileNav"></nav><div id="drawerHost"></div><div id="toastHost"></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"/>
<script>
'use strict';
const APPID='jianwei_demo_v02', DB='jianwei_local_demo_v02', STORE='records';const NAV=[['home','工作台','⌂'],['entry','录入','✎'],['radar','找资源','◎'],['clients','客户','♙'],['tasks','待办','◷']];const KIND={deposit:'存款',loan:'贷款',credit_card:'信用卡',wealth:'理财',other:'其他服务'};const ST={active:'明确需求',pending:'待核实',waiting:'等待条件',paused:'已暂停',cancelled:'已取消',fulfilled:'已完成',expired:'已过期'};let db=null,storageOK=false,state=null,page='home',selectedKind='deposit',clientFilter='',radarQ='',draft=null,selectedClient=null,busy=false;
const $=s=>document.querySelector(s);const iso=()=>new Date().toISOString();const day=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const offsetDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'x'+Date.now()+'_'+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const brief=(s,n=95)=>String(s||'').length>n?String(s).slice(0,n)+'…':String(s||'');const cid=id=>state.clients.find(c=>c.id===id);const logs=id=>state.records.filter(r=>r.clientId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.savedAt.localeCompare(a.savedAt));const opps=id=>state.opportunities.filter(o=>o.clientId===id).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;const button=(text,attrs='',cls='line')=>`<button class="btn ${cls}" ${attrs}>${text}</button>`;
function seed(){let clients=['A901','A902','D901','A903','D902','A904'].map((id,i)=>({id,name:'模拟客户'+['甲','乙','丙','丁','戊','己'][i],createdAt:offsetDays(-12+i),labels:[],blocked:{all:id==='A904',phone:false}}));let records=[],opportunities=[],tasks=[],audit=[];function add(id,date,text,kind,status,due='',task=''){let r={id:uid(),clientId:id,date,text,savedAt:iso(),extracted:{labels:[]}};records.push(r);let o={id:uid(),clientId:id,kind,status,quote:text,sourceId:r.id,date,savedAt:iso(),due,amount:null,missing:[],statusHistory:[]};opportunities.push(o);if(task)tasks.push({id:uid(),clientId:id,kind,opportunityId:o.id,title:task,due,status:'open',sourceId:r.id,result:''})}
add('A901',offsetDays(-12),'下周我有20万元定期到期，希望到时候看看一年期的存款安排。','deposit','active',offsetDays(4),'核实客户约定的到期服务');add('A902',offsetDays(-9),'我在其他银行还有一笔钱，年底到期以后再考虑转过来。','deposit','waiting','','等待客户确认他行资金到期时间');add('D901',offsetDays(-8),'装修贷款我想了解一下，等装修方案定好了再说。','loan','waiting');add('A903',offsetDays(-6),'之前想咨询一张信用卡，主要想知道日常支付权益。','credit_card','active');add('D902',offsetDays(-5),'之前咨询的贷款暂时不需要了，先取消。','loan','cancelled');add('A904',offsetDays(-4),'我不希望再收到营销联系，谢谢。','deposit','pending');
records.push({id:uid(),clientId:'A901',date:offsetDays(-2),text:'到期前再提醒我一次就行。',savedAt:iso(),extracted:{labels:['到期服务']}});return {appVersion:2,clients,records,opportunities,tasks,audit,createdAt:iso(),updatedAt:iso(),synthetic:true}}
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('当前浏览器不支持本地存储'));let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||Error('数据库打开失败'))})}function readDB(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function writeDB(data){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(data,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('写入失败'))})}
async function save(data,what){if(!storageOK){toast('保存不可用：此页面仅可查看演示');return false}if(busy)return false;busy=true;data.updatedAt=iso();try{await writeDB(data);let check=await readDB();if(!check||check.updatedAt!==data.updatedAt||check.records.length!==data.records.length)throw Error('写入验证未通过');state=check;toast(what+' · 已保存到当前浏览器');render();return true}catch(e){toast('没有保存成功：'+e.message);return false}finally{busy=false}}
function clone(){return structuredClone(state)}function toast(t){$('#toastHost').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toastHost').innerHTML='',3900)}
function navigation(){let navhtml=NAV.map(([v,label,icon])=>`<button class="${page===v?'active':''}" data-page="${v}"><span class="ico">${icon}</span>${label}</button>`).join('');$('#sideNav').innerHTML=navhtml+`<button class="${page==='settings'?'active':''}" data-page="settings"><span class="ico">⚙</span>设置与备份</button>`;$('#mobileNav').innerHTML=navhtml;$('#dateTop').textContent=day()}

function entryView(){let d=draft?.input||{};return `<div class="cardmax"><div class="stepper">01 口述 / 输入　 →　02 本地辅助提取　 →　<b>03 人工确认入库</b></div><h2 class="viewtitle">记录一次客户沟通</h2><p class="intro">只需客户编号和一段话，不必再填十几项画像字段。已有客户会自动追加历史记录。</p><section class="panel"><div class="fields"><label class="field">客户编号（必填；也可在原话中说 A901）<input id="inputId" placeholder="A905 或 D906" value="${esc(d.id||'')}" maxlength="12"/></label><label class="field">沟通日期<input id="inputDate" type="date" value="${esc(d.date||day())}"/></label></div><div style="margin-top:14px"><label class="field">你和客户说了什么？<textarea id="inputText" placeholder="例如：A905，今天办理20万元一年期存款，家住附近。客户说年底有另一笔资金到期，想届时再商量；对礼品比较在意。">${esc(d.raw||'')}</textarea></label></div><div class="recordActions"><div class="row"><button class="btn tiny line" id="exampleBtn">填入虚构示例</button><button class="btn tiny line" id="voiceBtn">🎙 语音输入提示</button></div><button class="btn primary" id="analyzeBtn">识别并核对 →</button></div><div class="alert warn">当前“智能识别”是<strong>离线规则辅助提取</strong>，并非 GPT 自然语言模型。复杂对话、多个金额、模糊日期必须人工核实；不调用外部服务。</div><div id="previewHolder">${draft?.result?previewHtml(draft):''}</div></section></div>`}
function parseDate(raw,base){let m=raw.match(/(?:明天|后天|([一二两三四五六七八九十\d]+)天后|下周|下个月|\d{1,2}月\d{1,2}[日号])/);if(!m)return null;let d=new Date(base+'T12:00:00');if(isNaN(d))return null;const add=n=>{d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};if(m[0]==='明天')return {date:add(1),raw:m[0],exact:true};if(m[0]==='后天')return {date:add(2),raw:m[0],exact:true};if(m[1]){let cn='一二三四五六七八九十',n=/^\d+$/.test(m[1])?Number(m[1]):(m[1]==='十'?10:m[1].length===2&&m[1][0]==='十'?10+cn.indexOf(m[1][1])+1:cn.indexOf(m[1])+1);if(n>0&&n<=365)return {date:add(n),raw:m[0],exact:true}}if(m[0].includes('月')&&/\d/.test(m[0])){let a=m[0].match(/(\d{1,2})月(\d{1,2})/);if(a){d.setMonth(Number(a[1])-1,Number(a[2]));if(d.toISOString().slice(5,10)!==[a[1].padStart(2,'0'),a[2].padStart(2,'0')].join('-'))return {date:'',raw:m[0],exact:false};if(d.toISOString().slice(0,10)<base)d.setFullYear(d.getFullYear()+1);return {date:d.toISOString().slice(0,10),raw:m[0],exact:true}}}return {date:'',raw:m[0],exact:false}}
function extract(raw,date){
 let txt=raw.replace(/\s+/g,' ').trim(),labels=[],proposals=[],alerts=[],facts=[];const tag=x=>{if(!labels.includes(x))labels.push(x)};
 if(/家住.{0,6}附近|住在.{0,8}附近|离网点.{0,5}近|住这附近/.test(txt))tag('居住附近');
 if(/在其他银行|他行|别的银行/.test(txt))tag('他行资金线索');
 if(/(?:在意|关注|喜欢|关心).{0,5}礼品|礼品.{0,5}(?:在意|重要)/.test(txt))tag('关注礼品');

 if(/女士|女性客户|女客户/.test(txt))facts.push({key:'性别（客户口述）',value:'女'});else if(/先生|男性客户|男客户/.test(txt))facts.push({key:'性别（客户口述）',value:'男'});
 if(/一年期|两年期|三年期|半年期|活期/.test(txt)){let d=txt.match(/一年期|两年期|三年期|半年期|活期/);facts.push({key:'曾谈及存款期限',value:d[0]})}
 if(/买过理财|以前买过理财/.test(txt))facts.push({key:'理财经历（客户自述）',value:'曾买过'});
 let segments=txt.split(/[，。；;！？\n]/).map(s=>s.trim()).filter(Boolean);
 let amounts=[...txt.matchAll(/(?:人民币)?(\d+(?:\.\d+)?)\s*(亿|万|千|元)/g)].slice(0,20).map(m=>({raw:m[0],value:Number(m[1])*({亿:1e8,万:1e4,千:1e3,元:1}[m[2]]),unit:'元'}));
 if(amounts.some(a=>!Number.isFinite(a.value))){alerts.push('发现异常金额，无法建立金额事实');amounts=[]}
 if(amounts.length>1)alerts.push('原话包含多笔金额，请逐笔核对用途；不会自动求和或当作AUM');
 function kindsFor(s){let ks=[];if(/定期|存款|大额存单|转存|存钱|存了|新存|存到|资金到期|他行资金到期|不存了/.test(s))ks.push('deposit');if(/贷款|借款|按揭|房贷|经营周转融资/.test(s))ks.push('loan');if(/信用卡|办卡权益|卡片额度/.test(s))ks.push('credit_card');if(/理财|基金|保险/.test(s))ks.push('wealth');return ks}
 function decide(s,k){let cancel=k==='deposit'?/(?:不存了|不考虑存款|暂时不存|不想存|不再存|取消存款)/:k==='loan'?/(?:贷款不需要|不贷款了|不办贷款|暂时不贷|贷款取消)/:k==='credit_card'?/(?:不办信用卡|信用卡不需要|不想办卡|取消办卡)/:/(?:不买理财|暂不考虑理财)/;
 if(cancel.test(s)||k==='deposit'&&/(?:存款|存钱|存款计划).{0,8}取消|取消.{0,8}(?:存款|存钱)/.test(s))return 'cancelled';
 if(k==='deposit'&&/(?:今天|刚刚|刚|已经|已|当日|昨天|今日).{0,15}(?:新存|存了|存入|存到|转存|办理了)/.test(s))return 'fulfilled';
 if(/资金没到|钱没到|尚未到账|等.+以后|等.+再|暂时无法|还没确定|到期以后|到期后再|届时再|可能.{0,15}到期/.test(s))return 'waiting';

   let part=segments[i],kinds=kindsFor(part);if(!kinds.length)continue;

   let next=segments[i+1]||'';
   let joined=part;
   // “月底有他行资金到期，届时再商量存款”合为一项待条件机会。
   if(/到期|钱没到|资金没到/.test(part)&&/届时|到时候|等.+再/.test(next)&&kindsFor(next).includes('deposit')){joined+='，'+next;i++}
   for(let k of kinds){
     if(k==='deposit'&&/(?:存款|存钱|存款计划).{0,8}取消|取消.{0,8}(?:存款|存钱)/.test(part)&&proposals.some(p=>p.kind==='deposit'&&p.status==='cancelled'))continue;
     if(k==='wealth'&&/以前买过|之前买过|曾经买过/.test(part)&&!/想了解|咨询|考虑|准备|希望/.test(part))continue;

     let amt=null;
     if(amountsHere.length===1){let type=status==='fulfilled'?'本次办理金额':/他行|其他银行|别的银行/.test(joined)?'未经核实金额':'意向金额';amt={...amountsHere[0],type}}
     if(amountsHere.length>1)alerts.push('“'+brief(part,28)+'”包含多笔金额，本项金额保持未知');
     proposals.push({kind:k,status,amount:amt,due:dt?.exact?dt.date:'',dateText:dt?.raw||'',quote:joined,needsReview:true});
   }
 }
 // 独立提取服务约定：即使同一句没有再次出现‘存款/贷款’字样，也识别‘3天后再联系’。
 // 此处只是有限规则提取，客户明确拒绝联系时不会生成可执行主动联系任务。
 let followups=[];
 for(const part of txt.split(/[，。；;！？\n]/).map(s=>s.trim()).filter(Boolean)){
   if(!/(?:再联系|再沟通|再问|回电|回访|再打电话|约好|约定|提醒我|联系我)/.test(part))continue;
   if(/(?:不要|别|不希望|拒绝|停止).{0,8}(?:联系|回访|回电|提醒|打电话)|(?:联系|回访).{0,8}(?:不要|取消|不用)/.test(part))continue;
   let when=parseDate(part,date);
   if(when?.exact){followups.push({title:'核实客户约定的后续服务',due:when.date,dateText:when.raw,quote:part,needsReview:true})}
   else if(when){alerts.push('沟通约定“'+brief(part,24)+'”时间不精确，需核实后再设固定提醒')}
   else{alerts.push('发现后续沟通约定，但缺少准确时间：'+brief(part,30))}
 }
 let blockedAll=/不要再联系|不希望.*(?:联系|营销)|别再.*(?:联系|推销)|停止.*营销|拒绝.*联系/.test(txt),blockedPhone=/别.*打电话|不要.*打电话|不想接.*电话|拒绝电话联系/.test(txt);
 if(blockedAll)alerts.unshift('识别到拒绝联系表达：保存后将建立独立安全阻断');else if(blockedPhone)alerts.unshift('识别到拒绝电话联系：应阻断电话渠道');
 if(!proposals.length)alerts.push('未识别到新的业务机会；沟通原文仍会完整保存');
 if(/(?:丈夫|妻子|老公|老婆|儿子|女儿|父亲|母亲|家人|家属)/.test(txt))alerts.push('涉及家庭成员：不能把家属资产和需求自动归入该客户');

}
function collect(){let text=$('#inputText')?.value.trim()||'',date=$('#inputDate')?.value||day(),id=($('#inputId')?.value||'').trim().toUpperCase(),found=text.toUpperCase().match(/(?:^|[^A-Z0-9])([AD]\d{3,8})(?!\d)/);if(!id&&found)id=found[1];return {id,date,raw:text}}
function analyze(){let input=collect();if(!/^[AD]\d{3,8}$/.test(input.id))return toast('请提供A/D开头的稳定客户编号，例如A905');if(!input.raw)return toast('请先记录客户原话');if(input.raw.length>5500)return toast('原话过长，请拆成多次沟通记录');if(!/^\d{4}-\d{2}-\d{2}$/.test(input.date))return toast('请核实沟通日期');let ids=[...new Set([...input.raw.toUpperCase().matchAll(/\b[AD]\d{3,8}\b/g)].map(x=>x[0]))];let result=extract(input.raw,input.date);if(ids.length&&(!ids.includes(input.id)||ids.length>1))result.alerts.unshift('原话编号与当前输入可能冲突，保存前必须检查');draft={input,result};$('#inputId').value=input.id;$('#previewHolder').innerHTML=previewHtml(draft);$('#reviewConfirm')?.scrollIntoView({behavior:'smooth',block:'center'})}

async function confirmSave(){if(!draft)return toast('请先识别并核对');if(!$('#reviewConfirm')?.checked)return toast('请先勾选核对确认');let current=collect(),d=draft.input;if(current.id!==d.id||current.date!==d.date||current.raw!==d.raw)return toast('输入内容发生变化，请重新识别');let data=clone(),c=data.clients.find(x=>x.id===d.id);if(!c){c={id:d.id,name:'模拟客户 '+d.id,createdAt:d.date,labels:[],facts:[],blocked:{all:false,phone:false}};data.clients.unshift(c)}for(let t of draft.result.labels)if(!c.labels.includes(t))c.labels.push(t);let r={id:uid(),clientId:d.id,date:d.date,text:d.raw,savedAt:iso(),extracted:{labels:draft.result.labels,alerts:draft.result.alerts}};data.records.push(r);for(let f of (draft.result.facts||[])){if(!c.facts)c.facts=[];c.facts.push({...f,sourceId:r.id,date:d.date,verification:'自述未核实'})}

}
if(draft.result.blockedAll)c.blocked.all=true;if(draft.result.blockedPhone)c.blocked.phone=true;data.audit.push({at:iso(),clientId:d.id,action:'人工确认并追加沟通；保存候选业务机会'});let ok=await save(data,'沟通已记录');if(ok){selectedClient=d.id;page='clients';render()}}
function rank(o){let p={active:8,waiting:5,pending:4,paused:2,cancelled:0,fulfilled:0,expired:0}[o.status]||0;if(o.due)p+=1;let c=cid(o.clientId);if(c?.blocked?.all)p-=100;return p}function groupFor(o){let c=cid(o.clientId);if(c?.blocked?.all||['cancelled','fulfilled','expired'].includes(o.status))return 'excluded';if(o.status==='active')return 'clear';return 'review'}
function radarView(){let candidates=state.opportunities.filter(o=>o.kind===selectedKind).filter(o=>!radarQ||[o.clientId,o.quote,KIND[o.kind]].some(x=>String(x).includes(radarQ))).sort((a,b)=>rank(b)-rank(a)||b.date.localeCompare(a.date)),g={clear:[],review:[],excluded:[]};for(let o of candidates)g[groupFor(o)].push(o);let groups=[['clear','有明确需求的线索','已存在相关表达，仍需核实联系许可'],['review','需进一步核实','条件未满足、尚待审核或信息不足'],['excluded','已排除或被阻断','取消/完成的需求或客户明确拒绝联系']];return `<h2 class="viewtitle">找业务资源</h2><p class="intro">输入银行当前的业务任务，跨A、D客户主客群检索。返回每位客户的证据与限制，而不是只给一个姓名名单。</p><div class="toolbar"><div class="filters">${Object.entries(KIND).filter(x=>x[0]!=='other').map(([k,v])=>`<button class="chip ${selectedKind===k?'active':''}" data-searchkind="${k}">${esc(v)}</button>`).join('')}</div><input class="searchbar" id="radarSearch" placeholder="按客户编号或沟通原文进一步搜索" value="${esc(radarQ)}"/></div><div class="alert" style="margin-bottom:18px">只做内部服务线索匹配。无明确联系授权的客户不会被标记为“可以主动营销”；拒绝联系优先阻断。</div>${groups.map(([key,title,desc])=>`<section class="group"><div class="grouphead">${esc(title)} ${badge(g[key].length,key==='clear'?'blue':key==='excluded'?'red':'amber')}<span class="count">${esc(desc)}</span></div><div class="resultList">${g[key].map(o=>opCard(o)).join('')||`<div class="empty"><b>当前没有${esc(title)}</b>可以换一个业务任务，或继续积累虚构沟通记录。</div>`}</div></section>`).join('')}`}
function opCard(o){let c=cid(o.clientId),g=groupFor(o),access=c?.blocked?.all?'禁止主动联系':c?.blocked?.phone?'禁止电话联系':'营销联系许可未核实';let note=o.status==='waiting'?'等待客户所述条件满足，暂不主动执行':o.status==='pending'?'先确认是否确有当前需求':o.status==='active'?'复核需求有效性、资金用途及接触条件':o.status==='cancelled'?'原需求已取消，不能继续按旧线索联系':'保留历史，不作为当前触达理由';return `<article class="resultcard"><div class="top"><h3>${esc(o.clientId)} <span class="sub">· ${esc(KIND[o.kind])}</span></h3>${badge(ST[o.status],g==='clear'?'blue':g==='excluded'?'red':'amber')}</div><p>主客群：${o.clientId[0]==='A'?'存款':'贷款'}　·　线索日期 ${esc(o.date)}　·　${esc(access)}</p><div class="quote">“${esc(brief(o.quote,230))}”</div><p><strong>匹配依据：</strong>客户沟通曾提到${esc(KIND[o.kind])}相关内容。${o.amount?' 金额：'+esc(o.amount.raw)+'（'+esc(o.amount.type)+'，未经交易核验）。':''}${o.due?' 关联日期：'+esc(o.due)+'。':''}</p><p><strong>下一步建议：</strong>${esc(note)}。不得推断客户必然办理、准入或产品适当性。</p><div class="row space"><span class="tinytext">来源：沟通记录 ${esc(o.sourceId.slice(0,8))}…</span><button class="btn tiny line" data-client="${esc(o.clientId)}">客户历史 →</button></div></article>`}
function clientsView(){let list=state.clients.filter(c=>!clientFilter||[c.id,c.name,...(c.labels||[])].some(s=>String(s).toLowerCase().includes(clientFilter.toLowerCase()))).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class="row space" style="margin-bottom:16px"><div><h2 class="viewtitle">客户与长期记忆</h2><p class="intro" style="margin:0">一位客户一个编号，多次沟通持续追加，历史不被覆盖。</p></div><button class="btn primary" data-page="entry">＋ 新沟通</button></div><div class="toolbar"><input id="clientSearch" class="searchbar" placeholder="搜索编号、标签、称呼" value="${esc(clientFilter)}"/>${badge('累计 '+state.clients.length+' 位客户')}</div><section class="panel">${list.map(c=>{let r=logs(c.id)[0];return `<div class="item"><div class="avatar">${esc(c.id.slice(0,1))}</div><div class="grow"><div class="itemtitle">${esc(c.id)} · ${esc(c.name)}</div><div class="sub line-clamp">${r?esc(r.text):'尚无沟通原文'}</div><div class="row" style="margin-top:7px">${badge('沟通 '+logs(c.id).length)} ${badge('机会 '+opps(c.id).length,'blue')} ${c.blocked?.all?badge('拒绝联系','red'):''}</div></div><button class="btn tiny line" data-client="${esc(c.id)}">查看</button></div>`}).join('')||'<div class="empty"><b>没有匹配的客户</b>试试其他编号或标签</div>'}</section>`}
function drawer(id){selectedClient=id;let c=cid(id);if(!c)return;let rs=logs(id),os=opps(id);$('#drawerHost').innerHTML=`<div class="drawerBackdrop" id="backdrop"><div class="drawer" role="dialog" aria-modal="true" aria-label="客户档案"><div class="drawerhead"><div><div class="eyebrow">CUSTOMER FILE · ${esc(id)}</div><h2>${esc(c.name)} <span class="badge">${esc(id)}</span></h2><div class="sub">${id[0]==='A'?'存款':'贷款'}主客群 · ${rs.length}次沟通 · ${os.length}项业务机会</div></div><button class="iconbtn" id="closeDrawer" aria-label="关闭">×</button></div><div class="blocklabel">当前标签与联系限制</div><div class="tokens">${c.labels.map(x=>`<span class="token">${esc(x)}</span>`).join('')||'<span class="muted">尚未形成标签</span>'}</div><div class="alert ${c.blocked?.all?'red':'warn'}">${c.blocked?.all?'客户已明确拒绝联系 · 安全阻断中':c.blocked?.phone?'客户拒绝电话联系；其他用途与渠道许可仍需核实':'相关营销联系许可未知，不能默认允许主动营销'}</div>${!c.blocked?.all?`<button class="btn danger tiny" data-block="${esc(id)}" style="margin-top:10px">记录客户明确拒绝联系</button>`:''}<div class="blocklabel">画像摘录（口述、待核实）</div><div class="tokens">${(c.facts||[]).slice(-8).map(f=>`<span class="token">${esc(f.key)}：${esc(f.value)}</span>`).join('')||'<span class="muted">暂无年龄等明确资料</span>'}</div><div class="blocklabel">当前与历史业务机会</div>${os.map(o=>`<div class="item"><div class="grow"><div class="itemtitle">${esc(KIND[o.kind])} ${badge(ST[o.status],o.status==='cancelled'?'red':'blue')}</div><div class="sub">${esc(brief(o.quote,150))}</div><select class="statusselect" data-opstatus="${esc(o.id)}" aria-label="调整机会状态" style="margin-top:8px">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join('')||'<div class="muted">尚无机会记录</div>'}<div class="blocklabel">完整沟通历史（原文保留）</div><div class="timeline">${rs.map(r=>`<div class="event"><small>${esc(r.date)} · ${esc(r.id.slice(0,8))}</small><p>${esc(r.text)}</p></div>`).join('')||'<p class="muted">暂无记录</p>'}</div><button class="btn primary wide" data-append="${esc(id)}">＋ 给这位客户追加沟通</button></div></div>`}
function taskLine(t){let c=cid(t.clientId);return `<div class="item"><div class="avatar">◷</div><div class="grow"><div class="itemtitle">${esc(t.clientId)} · ${esc(t.title)}</div><div class="sub">${t.due?'约定日期 '+esc(t.due):'无明确日期'} · ${c?.blocked?.all?'禁止主动联系':'执行前核实许可及需求'}</div></div><button class="btn tiny line" data-client="${esc(t.clientId)}">档案</button></div>`}
function tasksView(){let tasks=state.tasks.slice().sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999'));return `<h2 class="viewtitle">待办与客户约定</h2><p class="intro">只记录有事实依据的服务节点；模糊时间不自动生成准确日期。</p><section class="panel">${tasks.map(t=>{let c=cid(t.clientId);return `<div class="item"><div class="avatar">◷</div><div class="grow"><div class="itemtitle">${esc(t.clientId)} · ${esc(t.title)} ${badge(t.status==='done'?'已记录结果':'待核实',t.status==='done'?'green':'amber')}</div><div class="sub">${t.due?'关联日期：'+esc(t.due):'具体日期未知'} · ${c?.blocked?.all?'禁止主动联系':'联系许可需另行核实'}</div>${t.result?`<div class="sub">实际反馈：${esc(t.result)}</div>`:''}</div><div class="row"><button class="btn tiny line" data-client="${esc(t.clientId)}">档案</button>${t.status!=='done'?`<button class="btn tiny soft" data-taskdone="${esc(t.id)}">记录结果</button>`:''}</div></div>`}).join('')||'<div class="empty"><b>暂无待办</b>重要时间或服务约定会显示在这里</div>'}</section>`}
function settingsView(){return `<h2 class="viewtitle">保存、备份与说明</h2><p class="intro">演示版记录只在当前设备、当前浏览器和当前站点地址下持久保存。关闭浏览器后通常可重新打开，但不是银行级数据库。</p><div class="cardmax"><section class="panel"><div class="panelhead"><h3>数据安全与备份</h3>${badge(storageOK?'本机数据库可写':'存储不可用',storageOK?'green':'red')}</div><div class="alert warn">清理浏览器数据、无痕模式、系统回收、切换域名或设备都可能导致丢失。仅限虚构数据演示。建议每次重大测试后导出 JSON 备份。</div><div class="settinggrid" style="margin-top:17px"><div class="settingbox"><b>完整 JSON 备份</b><p>包括客户、沟通原文、机会、待办和审核记录，可在同版本中恢复。</p>${button('导出完整备份','id="exportJson"','primary')}</div><div class="settingbox"><b>恢复备份</b><p>选择本演示站点导出的 JSON，确认后覆盖当前虚构演示数据。</p>${button('导入 JSON','id="importJson"')}</div><div class="settingbox"><b>两张表 CSV</b><p>导出客户台账和沟通记录，可用 Excel 打开（不保证原复杂工作簿无损转换）。</p><div class="row">${button('客户台账','id="exportClients"','line')}${button('沟通记录','id="exportRecords"','line')}</div></div><div class="settingbox"><b>重置演示数据</b><p>清空当前浏览器的演示记录并重新载入虚构客户。操作不可撤销。</p>${button('重置为初始演示','id="reset"','danger')}</div></div><div class="divider"></div><h3>版本与能力边界</h3><p>V0.3 · 手机体验版（新增独立约定日识别）。无需网络的本地规则提取，支持客户历史、业务匹配、联系阻断、备份恢复、人工更新需求状态。未接入外部大模型、银行数据、银行登录权限或云端数据库。当前工具不验证贷款准入、营销授权或投资适当性。</p></section></div>`}
function download(name,content,mime='application/json;charset=utf-8'){let b=new Blob([content],{type:mime}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}function makeCSV(rows){let q=x=>{let s=String(x??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};return '\ufeff'+rows.map(row=>row.map(q).join(',')).join('\r\n')}
function exportCsv(which){let rows=which==='clients'?[['客户编号','客户称呼','首次记录日期','标签','联系阻断','沟通次数'],...state.clients.map(c=>[c.id,c.name,c.createdAt,c.labels.join('；'),c.blocked?.all?'是':'否',logs(c.id).length])]:[['沟通ID','客户编号','日期','原始沟通内容','保存时间'],...state.records.map(r=>[r.id,r.clientId,r.date,r.text,r.savedAt])];download(which==='clients'?'非OC_客户台账_虚构演示.csv':'非OC_沟通记录_虚构演示.csv',makeCSV(rows),'text/csv;charset=utf-8')}
function verifyImport(b){if(b?.app!==APPID||!b.data||!Array.isArray(b.data.clients)||!Array.isArray(b.data.records)||!Array.isArray(b.data.opportunities)||!Array.isArray(b.data.tasks)||!Array.isArray(b.data.audit))throw Error('不是本版本生成的合法备份');let x=b.data;if(x.clients.length>2000||x.records.length>30000||x.opportunities.length>30000)throw Error('备份超过演示容量限制');if(x.clients.some(c=>!c||!/^[AD]\d{3,8}$/.test(c.id)||!Array.isArray(c.labels)||!c.blocked)||new Set(x.clients.map(c=>c.id)).size!==x.clients.length)throw Error('客户编号重复或客户字段有误');let cs=new Set(x.clients.map(c=>c.id));if(x.records.some(r=>!cs.has(r.clientId)||typeof r.text!=='string'||r.text.length>5500))throw Error('沟通历史损坏');if(x.opportunities.some(o=>!cs.has(o.clientId)||!KIND[o.kind]||!ST[o.status]))throw Error('机会记录格式错误');if(x.tasks.some(t=>!cs.has(t.clientId)))throw Error('待办存在未知客户');return x}
function bind(){document.addEventListener('click',async e=>{if(e.target.id==='backdrop'){selectedClient=null;$('#drawerHost').innerHTML='';return}let b=e.target.closest('button');if(!b)return;if(b.dataset.page){radarQ='';clientFilter='';go(b.dataset.page);return}if(b.dataset.searchkind){selectedKind=b.dataset.searchkind;radarQ='';go('radar');return}if(b.dataset.client){drawer(b.dataset.client);return}if(b.id==='closeDrawer'){selectedClient=null;$('#drawerHost').innerHTML='';return}if(b.id==='exampleBtn'){$('#inputId').value='A905';$('#inputText').value='A905，今天新存20万元一年期定期，家住网点附近。客户说下个月可能还有一笔他行资金到期，届时想再了解存款方案，对礼品比较在意。';return}if(b.id==='voiceBtn'){toast('点击原话输入框，使用手机键盘上的麦克风进行语音转文字；不要用于真实客户资料。');$('#inputText')?.focus();return}if(b.id==='analyzeBtn')return analyze();if(b.id==='confirmSave')return confirmSave();if(b.dataset.append){let id=b.dataset.append;selectedClient=null;page='entry';draft=null;render();$('#inputId').value=id;$('#inputText').focus();return}if(b.dataset.block){if(!confirm('确认客户明确拒绝联系？此安全阻断不提供一键解除。'))return;let x=clone(),c=x.clients.find(y=>y.id===b.dataset.block);c.blocked.all=true;x.audit.push({at:iso(),clientId:c.id,action:'确认拒绝联系阻断'});let ok=await save(x,'拒绝联系阻断');if(ok)drawer(c.id);return}if(b.dataset.taskdone){let t=state.tasks.find(x=>x.id===b.dataset.taskdone);if(!t||cid(t.clientId)?.blocked?.all)return toast('存在联系阻断或任务不存在，请先人工核查');let res=prompt('请填写已经发生的实际服务结果（未联系请不要写完成）：');if(res===null)return;if(!res.trim())return toast('请填写实际结果');let x=clone(),v=x.tasks.find(y=>y.id===t.id);v.status='done';v.result=res.trim().slice(0,300);x.audit.push({at:iso(),clientId:v.clientId,action:'任务记录结果：'+v.result});return save(x,'结果已记录')}if(b.id==='exportJson')return download('见微_虚构演示备份_'+day()+'.json',JSON.stringify({app:APPID,exportedAt:iso(),data:state},null,2));if(b.id==='importJson')return $('#importFile').click();if(b.id==='exportClients')return exportCsv('clients');if(b.id==='exportRecords')return exportCsv('records');if(b.id==='reset'){if(!confirm('重置会覆盖本机演示记录。建议先导出完整备份。确定重置？'))return;return save(seed(),'演示数据已重置')}});
document.addEventListener('change',async e=>{let s=e.target;if(s.dataset.opstatus){let x=clone(),o=x.opportunities.find(o=>o.id===s.dataset.opstatus);if(!o)return;let next=s.value;if(!ST[next])return;if(!confirm('确认将该业务机会调整为“'+ST[next]+'”？变更会保存审计记录。')){render();return}o.statusHistory.push({at:iso(),status:next,manual:true});o.status=next;o.savedAt=iso();x.audit.push({at:iso(),clientId:o.clientId,action:'人工变更机会状态：'+ST[next]});let id=o.clientId,ok=await save(x,'机会状态已更新');if(ok)drawer(id)}});
document.addEventListener('input',e=>{if(e.target.id==='clientSearch'){clientFilter=e.target.value;let start=e.target.selectionStart;let v=clientsView();$('#appContent').innerHTML=v;let a=$('#clientSearch');a.focus();a.setSelectionRange(start,start)}if(e.target.id==='radarSearch'){radarQ=e.target.value;let p=e.target.selectionStart;$('#appContent').innerHTML=radarView();let a=$('#radarSearch');a.focus();a.setSelectionRange(p,p)}});
$('#importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>22e6)throw Error('文件超过限制');let data=verifyImport(JSON.parse(await f.text()));if(!confirm('导入会覆盖全部当前演示数据。请确认已保存原数据备份，继续吗？'))return;await save(data,'虚构备份已恢复')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}})}
async function init(){bind();try{db=await openDB();storageOK=true;state=await readDB();if(!state){state=seed();await writeDB(state)}$('#saveStatus').textContent='本机存储可用 · 请定期备份'}catch(e){state=seed();storageOK=false;$('#saveStatus').textContent='存储不可用 · 禁止保存';toast('浏览器本地存储不可用，仅可预览，请换正常浏览器/HTTPS地址')}render()}
window.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
